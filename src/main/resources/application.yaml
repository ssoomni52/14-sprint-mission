discodeit:
  storage:
    type: local
    local:
      root-path: src/main/java/com/sprint/mission/discodeit/storage/storage

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
      ddl-auto: validate

logging:
  level:
    root: info
